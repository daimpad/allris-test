# Daten aus der OParl-API (Stadt Bonn) und OParl-Lite abrufen, aufbereiten, prüfen und die
# RIS-Karte mit allen Exporten über GitHub Pages veröffentlichen. Die fertige Seite steht zusätzlich
# im Branch `deploy`, aus dem eigene Server sie abrufen können (z. B. Plesk-Git). Läuft bei jedem Push auf main,
# täglich früh am Morgen (die Quelle wird täglich aktualisiert) und auf Knopfdruck.
name: Daten aktualisieren und Seite veröffentlichen

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write   # Branch deploy
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      # Der letzte erfolgreiche Abruf dient als Rückfall, falls eine Quelle nicht antwortet.
      - name: Rohdaten des letzten Laufs
        uses: actions/cache@v4
        with:
          path: |
            data/raw/papers.jsonl
            data/raw/consultations_lite.jsonl
            data/raw/organizations.json
            data/raw/verwaltungsbereiche.json
            data/raw/STAND.json
            data/geo/bebauungsplaene_bonn.geojson
            data/geo/bebauungsplaene_protokoll.tsv
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Abruf OParl-API Stadt Bonn (Vorlagen)
        run: python -m pipeline fetch-papers
        continue-on-error: true

      - name: Abruf OParl-API Stadt Bonn (Gremien, Ämter)
        run: python -m pipeline fetch-organizations
        continue-on-error: true

      - name: Abruf OParl-API Stadt Bonn (Sitzungen, Wahlperioden)
        run: python -m pipeline fetch-meetings
        continue-on-error: true

      # Der Dienst braucht bis zu 15 Minuten; die Geltungsbereiche ändern sich selten. Abruf daher montags
      # und auf Knopfdruck, sonst gilt der Stand aus dem Zwischenspeicher bzw. dem Repository.
      - name: Abruf Bebauungspläne (Geltungsbereiche, Stadt Bonn; montags und auf Knopfdruck)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            python -m pipeline fetch-plans
          else
            echo "Bebauungspläne: vorhandener Stand ($(python -c 'import json;print(json.load(open("data/geo/bebauungsplaene_bonn.geojson"))["meta"]["retrieved_at"])'))"
          fi
        timeout-minutes: 25
        continue-on-error: true

      # Hausnummern ändern sich selten; sonst gilt der Stand im Repository
      - name: Abruf Hausnummern (Stadt Bonn; montags und auf Knopfdruck)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            python -m pipeline fetch-housenumbers
          fi
        continue-on-error: true

      # Texte der Hauptdokumente (OParl-Lite) nur zur Verarbeitung (Verortung): eigener Zwischenspeicher, nie veröffentlicht
      - name: Volltexte des letzten Laufs
        uses: actions/cache@v4
        with:
          path: data/raw/texte.jsonl
          key: texte-${{ github.run_id }}
          restore-keys: texte-

      - name: Abruf Volltexte (OParl-Lite; neue und geänderte, höchstens 3.000 je Lauf)
        run: python -m pipeline fetch-texts
        timeout-minutes: 25
        continue-on-error: true

      - name: Abruf OParl-Lite (Sitzungen, Tagesordnungspunkte)
        run: python -m pipeline fetch-lite
        continue-on-error: true

      # Sprachmodell (Mistral, gekennzeichnet): Bestand im Branch kurzfassungen; neue Kurzfassungen und Orte der
      # Stufe C nur mit dem Secret MISTRAL_API_KEY, je höchstens 50 je Lauf. Auf der Seite erst nach Freigabe
      # (kurzfassung.FREIGEGEBEN, stufe_c.FREIGEGEBEN). Gesichert wird der Branch nach der Aufbereitung.
      - name: Kurzfassungen (Mistral; neue Texte, höchstens 50 je Lauf)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          KURZFASSUNGEN: _kurzfassungen
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" kurzfassungen > /dev/null; then
            git clone -q --depth 1 --branch kurzfassungen "$url" _kurzfassungen
          else
            git init -q -b kurzfassungen _kurzfassungen
          fi
          python -m pipeline kurzfassungen
        timeout-minutes: 30
        continue-on-error: true

      - name: Aufbereiten, Geokodierung, Export
        env:
          KURZFASSUNGEN: _kurzfassungen
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python -m pipeline build
          python -m pipeline stufe-c
          python -m pipeline export
          python -m pipeline check
          python -m pipeline soll

      - name: Ergebnisse des Sprachmodells sichern (Branch kurzfassungen)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d _kurzfassungen/.git ] || { echo "kein Bestand"; exit 0; }
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          cd _kurzfassungen
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "unverändert"; exit 0; fi
          git commit -q -m "Kurzfassungen und Orte der Stufe C $(date -u +%F)"
          git push -q "$url" HEAD:kurzfassungen
        continue-on-error: true

      # Baustellen für die Seite: aus dem Archiv (Branch archiv, täglich 05:23 UTC), sonst direkt aus den Feeds;
      # mögliche Umsetzungen nur mit Konfidenz hoch (vorläufig). Scheitert beides, bleibt die Ebene ausgeblendet.
      - name: Archiv der Baustellen
        uses: actions/checkout@v4
        with:
          ref: archiv
          path: _archiv
        continue-on-error: true

      # Audit aller Kandidaten täglich neu; die Stichprobe zur Prüfung von Hand bleibt unverändert
      - name: Baustellen und mögliche Umsetzungen
        run: |
          python -m pipeline baustellen-seite
          python -m pipeline kandidaten
        env:
          BAUSTELLEN_ARCHIV: _archiv
        continue-on-error: true

      - name: Verifikation gegen die OParl-API
        run: python -m pipeline verify
        continue-on-error: true

      - name: Datenpaket
        run: python -m pipeline package
        env:
          BAUSTELLEN_ARCHIV: _archiv

      - name: Seite zusammenstellen (Frontend, Exporte, Flächen)
        run: |
          mkdir -p _site/data/geo
          cp -r site/. _site/
          cp -r data/export _site/data/
          cp data/LICENSE-DATA.md _site/data/
          cp data/geo/*.geojson _site/data/geo/

      - name: Auffindbarkeit (robots.txt, sitemap.xml, Adressen für SITE_URL)
        run: python -m pipeline seo

      # Ohne Datenpaket (Zip, täglich vollständig neu), damit die Historie nur um die Änderungen
      # wächst; auf dem eigenen Server verweist der Link auf das Paket bei GitHub Pages.
      - name: Fertige Seite in den Branch deploy schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" deploy > /dev/null; then
            git clone -q --depth 1 --branch deploy "$url" _deploy
          else
            git init -q -b deploy _deploy
          fi
          find _deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r _site/. _deploy/
          rm -f _deploy/data/export/allris-bonn-export.zip
          cp deploy/htaccess _deploy/.htaccess
          sed -i 's|href="data/export/allris-bonn-export.zip"|href="https://daimpad.github.io/allris-test/data/export/allris-bonn-export.zip"|' _deploy/index.html _deploy/datenschutz.html
          cd _deploy
          git add -A
          if git diff --cached --quiet; then echo "Seite unverändert"; exit 0; fi
          git commit -q -m "Seite aus ${GITHUB_SHA::7}, erzeugt $(date -u +%F)"
          git push -q "$url" HEAD:deploy

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
