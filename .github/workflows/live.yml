# Prüft nach jeder Veröffentlichung und täglich, ob die Seite unter der Hauptadresse und auf GitHub Pages
# erreichbar ist und aktuelle Daten zeigt. Schlägt die Prüfung fehl, benachrichtigt GitHub per E-Mail
# (Einstellungen → Notifications → Actions: „Notify on failed workflows“).
name: Live-Prüfung

on:
  workflow_run:
    workflows: ["Daten aktualisieren und Seite veröffentlichen"]
    types: [completed]
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      # abgebrochen heißt: ein neuerer Lauf hat ihn ersetzt; dessen Prüfung folgt (keine Fehlermeldung)
      - name: Veröffentlichung abgeschlossen?
        if: github.event_name == 'workflow_run' && !contains(fromJSON('["success", "cancelled"]'), github.event.workflow_run.conclusion)
        run: |
          echo "::error::Der Lauf „Daten aktualisieren und Seite veröffentlichen“ endete mit ${{ github.event.workflow_run.conclusion }}"
          exit 1

      # Der eigene Server holt den Branch deploy per Webhook; etwas Zeit lassen
      - name: Warten auf die Bereitstellung
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        run: sleep 180

      - name: Hauptadresse und Spiegel prüfen
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        run: |
          set -u
          fail=0
          check() {  # Adresse, erwarteter Inhalt
            body=$(curl -fsSL --retry 3 --retry-delay 10 "$1") || { echo "::error::$1 nicht erreichbar"; fail=1; return; }
            echo "$body" | grep -q "$2" || { echo "::error::$1 enthält nicht „$2“"; fail=1; return; }
            echo "ok  $1"
          }
          for base in https://ris-bonn.datenatlas.de/ https://daimpad.github.io/allris-test/; do
            check "$base" "Ratsatlas"
            check "${base}data/export/bonn/index.json" "generated_at"
            check "${base}datenschutz.html" "Verantwortlich"
          done
          # Unterseiten und Feed über ganz Bonn (seit 01.11.2026; Themen- und Haushaltsseite, Seite rss/, eine Gebietsseite)
          for base in https://ris-bonn.datenatlas.de/ https://daimpad.github.io/allris-test/; do
            check "${base}rss/" "Inhalte abonnieren und weiterverwenden"
            check "${base}haushalt/" "Haushalt auf einen Blick"
            check "${base}thema/" "<h1>Themen"
            check "${base}ortsteil/endenich/" "Ratsvorlagen in Endenich"
            feed="${base}data/export/bonn/feeds/ganz-bonn.xml"
            n=$(curl -fsSL --retry 3 --retry-delay 10 "$feed" | python3 -c 'import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.stdin).getroot(); a = "{http://www.w3.org/2005/Atom}"
          print(len(r.findall(a + "entry")) if r.tag == a + "feed" else 0)') || n=0
            if [ "${n:-0}" -gt 0 ]; then echo "ok  $feed ($n Einträge)"; else echo "::error::$feed ist kein Atom-Feed mit Einträgen"; fail=1; fi
          done
          # Graue Kartenkacheln (kacheln.yml, seit 02.11.2026); fehlen sie, zeigt die Seite OSM grau gefiltert: nur Hinweis
          for base in https://ris-bonn.datenatlas.de/ https://daimpad.github.io/allris-test/; do
            if curl -fsSL --retry 3 --retry-delay 10 "${base}kacheln/stand.json" | grep -q '"build"' \
              && curl -fsSIL --retry 3 --retry-delay 10 "${base}kacheln/12/2128/1375.png" > /dev/null; then
              echo "ok  ${base}kacheln/"
            else
              echo "::warning::${base}kacheln/ fehlt oder ist unvollständig (Rückfall auf OSM-Kacheln)"
            fi
          done
          check https://ris-bonn.datenatlas.de/robots.txt "Sitemap: https://ris-bonn.datenatlas.de/sitemap.xml"
          check https://ris-bonn.datenatlas.de/sitemap.xml "<urlset"
          # Datenstand höchstens zwei Tage alt
          stand=$(curl -fsSL https://ris-bonn.datenatlas.de/data/export/bonn/index.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["meta"]["generated_at"][:10])') || stand=""
          if [ -z "$stand" ] || [ $(( ( $(date -u +%s) - $(date -u -d "$stand" +%s) ) / 86400 )) -gt 2 ]; then
            echo "::error::Datenstand auf ris-bonn.datenatlas.de ist älter als zwei Tage (${stand:-unbekannt})"; fail=1
          else
            echo "ok  Datenstand $stand"
          fi
          # Holt der eigene Server den Branch deploy ab? Gleicher Stand wie im Branch (21.10.2026: Server blieb
          # elf Stunden auf einem älteren Stand, die Prüfung auf zwei Tage bemerkte es nicht)
          gen() { curl -fsSL "$1?pruefung=$(date +%s)" | python3 -c 'import json,sys;print(json.load(sys.stdin)["meta"]["generated_at"])'; }
          soll=$(gen https://raw.githubusercontent.com/${{ github.repository }}/deploy/data/export/bonn/index.json) || soll=""
          ist=$(gen https://ris-bonn.datenatlas.de/data/export/bonn/index.json) || ist=""
          if [ -n "$soll" ] && [ "$soll" != "$ist" ]; then
            echo "::error::ris-bonn.datenatlas.de zeigt den Stand ${ist:-unbekannt}, der Branch deploy $soll – der Server holt den Branch nicht ab (Plesk: Git → Webhook bzw. „Abrufen“)"; fail=1
          else
            echo "ok  Hauptadresse auf dem Stand des Branch deploy ($soll)"
          fi
          exit $fail

      # deploy/htaccess setzt Sicherheitskopfzeilen und CORS; nginx liefert statische Dateien auf der Hauptadresse
      # derzeit ohne sie aus (Plesk, beim Auftraggeber offen). Bis zur Umstellung nur ein Hinweis, kein Fehler.
      - name: Kopfzeilen der Hauptadresse (Hinweis)
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        run: |
          # mit GET wie ein Browser: HEAD-Anfragen beantwortet der Server auf einem anderen Weg (mit Kopfzeilen)
          kopf() {  # Adresse, Kopfzeile
            if curl -fsS --retry 3 --retry-delay 10 -D - -o /dev/null "$1" | tr -d '\r' | grep -qi "^$2:"; then echo "ok  $1 $2"
            else echo "::warning::$1 ohne Kopfzeile $2"; fi
          }
          kopf https://ris-bonn.datenatlas.de/ X-Content-Type-Options
          kopf https://ris-bonn.datenatlas.de/ Strict-Transport-Security
          kopf https://ris-bonn.datenatlas.de/data/export/bonn/feeds/ganz-bonn.xml Access-Control-Allow-Origin
          kopf https://ris-bonn.datenatlas.de/data/export/bonn/index.json Access-Control-Allow-Origin
