# Quelldateien, die aus der Arbeitsumgebung nicht erreichbar sind (wahlen.bonn.de, stadtplan.bonn.de), auf Knopfdruck
# abrufen und unverändert mit Abrufstand im Branch `quellen` ablegen. Daraus entstehen nach Prüfung feste Ausschnitte
# im Repository (z. B. data/kontext/). Kein Einfluss auf die veröffentlichte Seite.
name: Quellen abrufen (auf Knopfdruck)

on:
  workflow_dispatch:

permissions:
  contents: write   # Branch quellen

concurrency:
  group: "quellen"
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: Branch quellen holen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          rc=0; git ls-remote --exit-code --heads "$url" quellen > /dev/null || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then echo "Abfrage des Branches quellen gescheitert ($rc)"; exit 1; fi
          if [ "$rc" -eq 0 ]; then git clone -q --depth 1 --branch quellen "$url" _quellen; else git init -q -b quellen _quellen; fi

      - name: Wahlen 2025 (Ergebnisse nach Stimmbezirk, Wahl- und Stimmbezirke)
        run: python -m pipeline wahlen-rohdaten

      - name: Sichern
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _quellen
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "unverändert"; exit 0; fi
          git commit -q -m "Quellen $(date -u +%F)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:quellen
