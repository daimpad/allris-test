name: Tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit-Tests (Akteure, Geokodierung, Prozessschritte, Feeds und Kalender, Chat-Daten)
        run: python -m unittest discover tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax der Webseite
        run: node --check site/app.js && node --check site/timeline.js && node --check site/chat/tools.js
      - name: Werkzeuge des Ratsassistenten
        run: node --test "tests/js/**/*.test.mjs"
