name: Fehler melden
description: Etwas auf der Seite oder in der Pipeline funktioniert nicht wie erwartet.
labels: ["fehler"]
body:
  - type: textarea
    id: beschreibung
    attributes:
      label: Was ist passiert, was hätten Sie erwartet?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachvollziehen
      placeholder: Link zur Seite (mit Gebiet und Drucksache), Browser, Befehl der Pipeline …
  - type: textarea
    id: ausgabe
    attributes:
      label: Fehlermeldung oder Ausgabe
      render: text
