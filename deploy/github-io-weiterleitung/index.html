<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ratsatlas Bonn</title>
  <script>
    // Weiterleitung der alten Spiegel-Adresse daimpad.github.io/allris-test/… auf daimpad.github.io/ratsatlas-bonn/…
    // (Repository umbenannt am 04.11.2026). Pfad, Suchparameter und Anker bleiben erhalten.
    (function () {
      var p = location.pathname;
      if (p === "/allris-test" || p.indexOf("/allris-test/") === 0) {
        location.replace("/ratsatlas-bonn" + p.slice("/allris-test".length) + location.search + location.hash);
      }
    })();
  </script>
  <style>
    body { margin: 0; font: 16px/1.6 system-ui, sans-serif; color: #0f0f14; background: #fafaff; }
    main { max-width: 640px; margin: 15vh auto; padding: 0 16px; }
    a { color: #6d28d9; }
  </style>
</head>
<body>
  <main>
    <h1>Ratsatlas Bonn ist umgezogen</h1>
    <p>Die Seite heißt jetzt Ratsatlas Bonn. Sie finden sie unter <a href="https://ris-bonn.datenatlas.de/">ris-bonn.datenatlas.de</a>; die Kopie auf GitHub liegt unter <a href="https://daimpad.github.io/ratsatlas-bonn/">daimpad.github.io/ratsatlas-bonn</a>.</p>
    <p>Feeds und Daten der Kopie liegen unter derselben Adresse, nur mit <code>ratsatlas-bonn</code> statt <code>allris-test</code> im Pfad.</p>
  </main>
</body>
</html>
